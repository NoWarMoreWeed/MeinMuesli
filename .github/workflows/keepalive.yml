name: Daily heartbeat

on:
  schedule:
    # GitHub-Cron ist UTC. 15:00 UTC = 17:00 CEST (Sommerzeit).
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sprungmuster: ~85 % der Tage laufen, ~15 % werden übersprungen.
      # Hash des Datums statt RANDOM => deterministisch, kein "immer gleich",
      # aber auch kein perfektes Muster. Ergebnis: 6-7 hellgrüne Quadrate
      # pro Woche mit unregelmäßigen Lücken, wie bei echtem Projektbetrieb.
      - name: Skip check
        id: skip
        run: |
          python3 - <<'EOF'
          import hashlib, datetime, sys
          day = datetime.date.today().isoformat()
          h = int(hashlib.sha256(day.encode()).hexdigest(), 16)
          if h % 100 < 15:
              print(f"skip day {day}")
              print("skip=true") >> "$GITHUB_OUTPUT"
          else:
              print(f"run day {day}")
          EOF

      - name: Update integrity check
        if: steps.skip.outputs.skip != 'true'
        run: |
          sleep $((RANDOM % 40 * 15 + 15))   # 15-600 s Zufallsversatz
          python3 - <<'EOF'
          import datetime, hashlib, json, os, glob
          files = sorted(glob.glob("**/*", recursive=True))
          files = [f for f in files if os.path.isfile(f)
                   and not f.startswith(".git") and f != "activity.json"]
          h = hashlib.sha256()
          for f in files:
              h.update(f.encode())
              h.update(open(f, "rb").read())
          data = {
              "last": datetime.datetime.now(
                  datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "files": len(files),
              "sha256": h.hexdigest(),
              "note": "auto-integrity-check",
          }
          json.dump(data, open("activity.json", "w"), indent=2)
          EOF
          cat activity.json

      - name: Commit and push
        if: steps.skip.outputs.skip != 'true'
        run: |
          MSGS=(
            "chore: integrity check"
            "chore: update site checksum"
            "chore: refresh file manifest"
            "chore: routine site check"
            "fix: checksum drift nach manuelen Aenderungen"
          )
          # Commit-Autor = Maikel (Noreply-Email), damit es in den
          # Contribution-Graph kommt. Pushen tut der Bot-Token.
          git config user.name "NoWarMoreWeed"
          git config user.email "81537345+NoWarMoreWeed@users.noreply.github.com"
          git add activity.json
          git commit -m "${MSGS[RANDOM % ${#MSGS[@]}]}"
          git push
