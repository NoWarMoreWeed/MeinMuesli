<!DOCTYPE html>
<!-- Hier können mehrere Früchte gewählt werden. -->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Früchte – MeinMüsli</title>
  <link rel="stylesheet" href="stylischermuesli.css">
</head>
<body class="mit-bon" data-seite="fruechte" data-kategorie="fruechte">
  <main>
    <!-- Kopfleiste: Mitarbeiter links, Verkaufsverlauf und Abmelden oben rechts. -->
    <header class="kopfleiste">
      <p id="mitarbeiterAnzeige" class="mitarbeiter-zeile"></p>
      <div class="kopf-aktionen">
        <button class="button-grau verkaufsverlauf-link" type="button" data-ziel="verlauf.html">Verkaufsverlauf</button>
        <button class="button-grau mitarbeiter-abmelden" type="button">Abmelden</button>
      </div>
    </header>

    <h1>Früchte</h1>

    <!-- Alle Preise stehen als Zahl in data-preis. -->
        <!-- Die Zutaten werden aus den Produktdaten erzeugt. -->
    <section id="zutatenRaster" class="zutaten-raster" aria-label="Früchte"></section>

    <nav class="buttonleiste" aria-label="Seitennavigation">
      <button class="button-grau" type="button" data-ziel="verfeinerung.html">Zurück</button>
      <button id="ueberspringenButton" type="button" data-ziel="nuesse.html">Überspringen</button>
      <button class="button-gelb" type="button" data-ziel="nuesse.html">Weiter</button>
    </nav>

    <!-- Abbrechen steht getrennt von der Navigation unten rechts. -->
    <nav class="abbrechen-leiste" aria-label="Bestellung">
      <button class="button-abbrechen bestellung-abbrechen" type="button">Bestellung abbrechen</button>
    </nav>
  </main>

  <aside id="bon" class="bon" aria-live="polite"></aside>
  <!-- Die Produktdaten stehen in einer eigenen Datei. -->
  <script src="produkte.js"></script>
  <script src="muesli.js"></script>
</body>
</html>
