<!DOCTYPE html>
<!-- Hier können mehrere Nüsse und Kokoschips gewählt werden.  W3Schools: https://www.w3schools.com/html/html5_semantic_elements.asp -->
<html lang="de">
<head>
  <!-- Dokumentkopf mit Zeichensatz, mobiler Ansicht und Stylesheet. W3Schools: https://www.w3schools.com/html/html_head.asp -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nüsse – MeinMüsli</title>
  <link rel="stylesheet" href="stylischermuesli.css?v=3">
</head>
<body class="mit-bon" data-seite="nuesse" data-kategorie="nuesse">
  <main>
    <!-- Kopfleiste: Mitarbeiter links, Verkaufsverlauf und Abmelden oben rechts.  W3Schools: https://www.w3schools.com/html/html5_semantic_elements.asp -->
    <header class="kopfleiste">
      <p id="mitarbeiterAnzeige" class="mitarbeiter-zeile"></p>
      <div class="kopf-aktionen">
        <button class="button-grau verkaufsverlauf-link" type="button" data-ziel="verlauf.html">Verkaufsverlauf</button>
        <button class="button-grau mitarbeiter-abmelden" type="button">Abmelden</button>
      </div>
    </header>

    <h1>Nüsse</h1>

        <!-- Die Zutaten werden aus den Produktdaten erzeugt.  W3Schools: https://www.w3schools.com/html/html_scripts.asp -->
    <section id="zutatenRaster" class="zutaten-raster" aria-label="Nüsse und Kokoschips"></section>

    <nav class="buttonleiste" aria-label="Seitennavigation">
      <button class="button-grau" type="button" data-ziel="fruechte.html">Zurück</button>
      <button id="ueberspringenButton" type="button" data-ziel="extras.html">Überspringen</button>
      <button class="button-gelb" type="button" data-ziel="extras.html">Weiter</button>
    </nav>

    <!-- Abbrechen steht getrennt von der Navigation unten rechts.  W3Schools: https://www.w3schools.com/tags/tag_button.asp -->
    <nav class="abbrechen-leiste" aria-label="Bestellung">
      <button class="button-abbrechen bestellung-abbrechen" type="button">Bestellung abbrechen</button>
    </nav>
  </main>

  <aside id="bon" class="bon" aria-live="polite"></aside>
  <!-- Die Produktdaten stehen in einer eigenen Datei.  W3Schools: https://www.w3schools.com/html/html_scripts.asp -->
  <script src="produkte.js?v=3"></script>
  <script src="muesli.js?v=3"></script>
</body>
</html>
