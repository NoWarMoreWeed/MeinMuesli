<!DOCTYPE html>
<!-- Einstiegspunkt der öffentlichen Demo. -->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interaktive MeinMüsli-Kassensystem-Demo im Browser.">
  <title>MeinMüsli-Kassensystem</title>
  <link rel="stylesheet" href="stylischermuesli.css">
</head>
<body data-seite="login">
  <main>
    <h1>MeinMüsli-Kassensystem</h1>
    <p class="seitenhinweis">Mitarbeiter-Anmeldung</p>
    <p class="demo-hinweis">
      Öffentliche Demo: Die Anmeldung wird ausschließlich lokal im Browser simuliert.
      Passwörter werden weder übertragen noch gespeichert.
    </p>

    <form id="loginFormular" class="login-bereich" novalidate>
      <div class="formulargruppe">
        <label for="mitarbeiter">Mitarbeiter</label>
        <select id="mitarbeiter" name="mitarbeiter">
          <option value="">Bitte auswählen</option>
          <option value="Mitarbeiter 1">Mitarbeiter 1</option>
          <option value="Mitarbeiter 2">Mitarbeiter 2</option>
          <option value="Mitarbeiter 3">Mitarbeiter 3</option>
          <option value="Mitarbeiter 4">Mitarbeiter 4</option>
        </select>
      </div>

      <div class="formulargruppe">
        <label for="passwort">Demo-Zugangscode</label>
        <input id="passwort" name="passwort" type="password" autocomplete="off">
      </div>

      <p id="loginFehler" class="fehlermeldung" aria-live="polite"></p>

      <div class="buttonleiste">
        <button id="loginZurueckButton" class="button-grau" type="button">Zurück</button>
        <button class="button-gelb" type="submit">Anmelden</button>
      </div>
    </form>
  </main>

  <script src="muesli.js"></script>
</body>
</html>
