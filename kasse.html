<!DOCTYPE html>
<!-- Diese Seite fasst die vollständige Bestellung zusammen.  W3Schools: https://www.w3schools.com/html/html5_semantic_elements.asp -->
<html lang="de">
<head>
  <!-- Dokumentkopf mit Zeichensatz, mobiler Ansicht und Stylesheet. W3Schools: https://www.w3schools.com/html/html_head.asp -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasse – MeinMüsli</title>
  <link rel="stylesheet" href="stylischermuesli.css?v=5">
</head>
<body data-seite="kasse">
  <main>
    <!-- Kopfleiste: Mitarbeiter links, Verkaufsverlauf und Abmelden oben rechts.  W3Schools: https://www.w3schools.com/html/html5_semantic_elements.asp -->
    <header class="kopfleiste">
      <p id="kassenMitarbeiter" class="mitarbeiter-zeile"></p>
      <div class="kopf-aktionen">
        <button class="button-grau verkaufsverlauf-link" type="button" data-ziel="verlauf.html">Verkaufsverlauf</button>
        <button class="button-grau mitarbeiter-abmelden" type="button">Abmelden</button>
      </div>
    </header>
    <h1>Kasse</h1>

    <!-- Zuerst wird mit zwei Knöpfen entschieden, wie gegessen wird.  W3Schools: https://www.w3schools.com/tags/tag_button.asp -->
    <section class="verzehrart-bereich" aria-labelledby="verzehrartUeberschrift">
      <h2 id="verzehrartUeberschrift">Wie wird gegessen?</h2>
      <div class="buttonleiste">
        <button id="mitnehmenButton" class="verzehrart-button" type="button">Zum Mitnehmen</button>
        <button id="hierEssenButton" class="verzehrart-button" type="button">Hier essen</button>
      </div>
      <p id="verzehrartHinweis" class="verzehrart-hinweis" aria-live="polite"></p>
    </section>

    <!-- JavaScript erzeugt hier alle bestellten Müslis.  W3Schools: https://www.w3schools.com/html/html_scripts.asp -->
    <section id="kassenListe" class="kassenliste" aria-label="Bestellte Müslis"></section>

    <!-- Hier stehen Zwischensumme, Rabatt und der zu zahlende Betrag.  W3Schools: https://www.w3schools.com/html/html_scripts.asp -->
    <p id="gesamtpreis" class="gesamtpreis"></p>

    <!-- Der Rabatt ab drei Müslis wird mit einem Knopf angewendet.  W3Schools: https://www.w3schools.com/tags/att_disabled.asp -->
    <section class="rabatt-bereich" aria-labelledby="rabattUeberschrift">
      <h2 id="rabattUeberschrift">Mengenrabatt</h2>
      <div class="buttonleiste">
        <button id="rabattButton" class="button-grau" type="button" disabled>10 % Rabatt anwenden</button>
      </div>
      <p id="rabattHinweis" class="rabatt-hinweis" aria-live="polite"></p>
    </section>

    <!-- Wurde der Rabatt vergessen, erscheint diese Erinnerung vor der Zahlung.  W3Schools: https://www.w3schools.com/tags/att_global_hidden.asp -->
    <section id="rabattErinnerung" class="rabatt-erinnerung" aria-labelledby="rabattErinnerungUeberschrift" hidden>
      <h2 id="rabattErinnerungUeberschrift">Rabatt vergessen?</h2>
      <p id="rabattErinnerungText" aria-live="polite"></p>
      <div class="buttonleiste">
        <button id="rabattJetztButton" class="button-gelb" type="button">Rabatt anwenden</button>
        <button id="rabattOhneButton" class="button-grau" type="button">Ohne Rabatt bezahlen</button>
      </div>
    </section>

    <!-- Danach wird zwischen Kartenzahlung und Barzahlung gewählt.  W3Schools: https://www.w3schools.com/html/html5_semantic_elements.asp -->
    <section class="zahlungsbereich" aria-labelledby="zahlungUeberschrift">
      <h2 id="zahlungUeberschrift">Zahlungsart wählen</h2>

      <div class="buttonleiste">
        <button id="karteButton" type="button">Karte</button>
        <button id="barButton" type="button">Bar</button>
      </div>

      <!-- Bei Kartenzahlung lässt sich das Terminal-Ergebnis simulieren.  W3Schools: https://www.w3schools.com/html/html5_semantic_elements.asp -->
      <div id="karteBereich" class="karten-bereich" hidden>
        <p>Ergebnis des Kartenterminals:</p>
        <div class="buttonleiste">
          <button id="karteErfolgreichButton" type="button">Zahlung erfolgreich</button>
          <button id="karteAbgelehntButton" class="button-grau" type="button">Zahlung abgelehnt</button>
        </div>
        <p id="kartenStatus" class="karten-status" aria-live="polite"></p>
      </div>

      <!-- Dieser Bereich erscheint nur bei einer Barzahlung.  W3Schools: https://www.w3schools.com/html/html5_semantic_elements.asp -->
      <div id="barBereich" class="bar-bereich" hidden>
        <label for="erhaltenerBetrag">Erhaltener Betrag</label>
        <input id="erhaltenerBetrag" type="text" inputmode="decimal" placeholder="zum Beispiel 10,00">
        <!-- Häufige Geldbeträge lassen sich direkt antippen.  W3Schools: https://www.w3schools.com/html/html5_semantic_elements.asp -->
        <div class="schnellgeld" aria-label="Schnellauswahl für erhaltenes Bargeld">
          <button type="button" data-schnellgeld="passend">Passend</button>
          <button type="button" data-schnellgeld="5">5 €</button>
          <button type="button" data-schnellgeld="10">10 €</button>
          <button type="button" data-schnellgeld="20">20 €</button>
          <button type="button" data-schnellgeld="50">50 €</button>
        </div>
        <p id="rueckgeldAusgabe" class="rueckgeld-ausgabe"></p>
        <!-- Der Vorschlag nennt passende Scheine und Münzen.  W3Schools: https://www.w3schools.com/html/html5_semantic_elements.asp -->
        <p id="rueckgeldVorschlag" class="rueckgeld-vorschlag" aria-live="polite"></p>
      </div>

      <p id="zahlungsFehler" class="fehlermeldung" aria-live="polite"></p>
      <div class="buttonleiste">
        <button id="zahlungAbschliessenButton" class="button-gelb" type="button" hidden>
          Zahlung abschließen
        </button>
      </div>
    </section>

    <!-- Nach erfolgreicher Zahlung wird nach dem Kassenbon gefragt.  W3Schools: https://www.w3schools.com/html/html_accessibility.asp -->
    <section id="bonFrage" class="bon-frage" aria-labelledby="bonUeberschrift" hidden>
      <h2 id="bonUeberschrift">Kassenbon gewünscht?</h2>
      <div class="buttonleiste">
        <button id="bonJaButton" class="button-gelb" type="button">Ja, Kassenbon speichern</button>
        <button id="bonNeinButton" class="button-grau" type="button">Nein</button>
      </div>
      <p id="bonStatus" class="bon-status" aria-live="polite"></p>
      <!-- Diese Buttons erscheinen erst nach der Bonentscheidung.  W3Schools: https://www.w3schools.com/html/html_accessibility.asp -->
      <div class="buttonleiste">
        <button id="bonDruckenButton" class="button-grau" type="button" hidden>Kassenbon drucken</button>
      </div>
      <div class="buttonleiste">
        <button id="bestellungBeendenButton" class="button-gelb" type="button" hidden>
          Bestellung beenden / Neue Bestellung
        </button>
      </div>
    </section>

    <!-- Die Bestellbestätigung zeigt Abholnummer, Fertigstellung und den Bon.  W3Schools: https://www.w3schools.com/html/html5_semantic_elements.asp -->
    <section id="bestellBestaetigung" class="bestell-bestaetigung" aria-labelledby="bestaetigungUeberschrift" hidden>
      <h2 id="bestaetigungUeberschrift">Bestellung angenommen</h2>
      <p id="abholnummer" class="abholnummer"></p>
      <p id="bestaetigungText" class="bestaetigung-text" aria-live="polite"></p>
      <h3>Kassenbon (Vorschau)</h3>
      <pre id="bonVorschau" class="bon-vorschau-text"></pre>
    </section>

    <nav class="buttonleiste" aria-label="Seitennavigation">
      <button id="zurueckZuExtrasButton" class="button-grau" type="button" data-ziel="extras.html">Zurück zu Extras</button>
      <!-- Der Warenkorb bleibt erhalten, nur das aktuelle Müsli wird geleert.  W3Schools: https://www.w3schools.com/html/html5_semantic_elements.asp -->
      <button id="weiteresProduktKasseButton" type="button">Weiteres Produkt</button>
    </nav>

    <!-- Abbrechen steht getrennt von der Navigation unten rechts.  W3Schools: https://www.w3schools.com/tags/tag_button.asp -->
    <nav class="abbrechen-leiste" aria-label="Bestellung">
      <button id="bestellungAbbrechenButton" class="button-abbrechen" type="button">Bestellung abbrechen</button>
    </nav>
  </main>

  <!-- Dieser Bereich enthält den Bon-Text zum Drucken und ist im Bildschirm ausgeblendet.  W3Schools: https://www.w3schools.com/html/html_accessibility.asp -->
  <pre id="druckInhalt"></pre>

  <!-- Die Produktdaten stehen in einer eigenen Datei.  W3Schools: https://www.w3schools.com/html/html_scripts.asp -->
  <script src="produkte.js?v=5"></script>
  <script src="muesli.js?v=5"></script>
</body>
</html>
